<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Biblio</title>
<meta name="description" content="Ma bibliothèque de mangas et webtoons : où j'en suis, et ce qui est sorti.">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Biblio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt=""><span>Ma Biblio</span></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="library">Scans</a>
      <a href="#/papier" data-tab="papier">Papier</a>
      <a href="#/nouveautes" data-tab="news">Nouveautés <b class="count" data-news-count hidden></b></a>
      <a href="#/stats" data-tab="stats">Stats</a>
      <a href="#/reglages" data-tab="settings">Réglages</a>
    </nav>
    <span class="sync-dot" data-sync title="Synchronisation"></span>
  </header>

  <main id="view"></main>

  <nav class="bottomnav" aria-label="Sections">
    <a href="#/" data-tab="library"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.8-1 3.2 15.5-3.8 1z"/></svg><span>Scans</span></a>
    <a href="#/papier" data-tab="papier"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm1 2v14h2V5zm4 0v6l2-1.5 2 1.5V5z"/></svg><span>Papier</span></a>
    <a href="#/nouveautes" data-tab="news"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zm-2 15a2 2 0 0 0 4 0z"/></svg><span>Nouveautés</span><b class="count" data-news-count hidden></b></a>
    <a href="#/stats" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg><span>Stats</span></a>
    <a href="#/reglages" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 2.3-1.9-.4a6.9 6.9 0 0 0-.7-1.6l1.1-1.6-1.9-1.9-1.6 1.1c-.5-.3-1-.5-1.6-.7L13.4 3h-2.8l-.4 1.9c-.6.2-1.1.4-1.6.7L7 4.5 5.1 6.4l1.1 1.6c-.3.5-.5 1-.7 1.6l-1.9.4v2.8l1.9.4c.2.6.4 1.1.7 1.6l-1.1 1.6 1.9 1.9 1.6-1.1c.5.3 1 .5 1.6.7l.4 1.9h2.8l.4-1.9c.6-.2 1.1-.4 1.6-.7l1.6 1.1 1.9-1.9-1.1-1.6c.3-.5.5-1 .7-1.6l1.9-.4z"/></svg><span>Réglages</span></a>
  </nav>

  <button class="fab" data-action="add" aria-label="Ajouter une série">
    <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
